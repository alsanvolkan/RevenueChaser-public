# Unit suite and end-to-end tier on every PR into main and on main (issue #103).
# Both are offline by design (root conftest.py blocks the network; e2e talks only
# to its local mock-provider server), so no secrets are needed.
name: tests

# CI minutes are limited, so this workflow runs only where it decides a merge:
#   - a pull request whose base is `main` (the daily batch PR, or a gated PR: see CLAUDE.md, PR granularity);
#   - a push to `main` (the backstop for semantic conflicts).
# A push to a work branch or to a `batch/*` branch runs nothing until that PR to `main` exists.
# Docs-only changes skip CI too. The filter lists every path that may run tests, then drops
# Markdown, .hermes/ and .claude/, then adds back the Markdown files a unit test reads
# (the list is _MARKDOWN_READ_BY_TESTS in core/tests/test_doc_constants.py, which fails when this file leaves one
# out) and the workflow files. Order matters: a later pattern
# overrides an earlier one. Any other file, code or data, runs CI. A skipped run leaves no check
# on the PR: that is expected for a docs-only PR, not a missing CI.
#
# SELECTIVE or FULL (the check names say which: `unit (SELECTIVE)`, `e2e (FULL)`, ...):
#   - a push to a PR runs only the test files that import a changed file, directly or transitively
#     (scripts/select_tests.py, job `plan`); it falls back to FULL whenever that is not safe to say;
#   - the label `full-ci` on the PR makes every run FULL, starting with the one the label itself triggers.
#     A label stays on the PR, so every later push is FULL too: the head that merges has a FULL run.
#   - a push to `main` and a manual dispatch are always FULL.
#   A run tests the PR merged into `main` as it was when the run started; if `main` moves on, the FULL run is not
#   repeated by itself (as before this change). Push, or re-add the label, to test the new merge.
# The merge gate is the `merge-gate` check: green only when this head's run was FULL and unit and e2e passed; a
# SELECTIVE run fails it on purpose. No check is required by a ruleset.
on:
  pull_request:
    branches: [main]
    # `labeled` is here for `full-ci`; any other label starts a run that tests nothing and keeps the head's merge-gate.
    types: [opened, synchronize, reopened, labeled]
    paths:
      - "**"
      - "!**.md"
      - "!.hermes/**"
      - "!.claude/**"
      - "docs/data_architecture.md"
      - "docs/data_health.md"
      - "docs/data_retrieval.md"
      - "docs/rules/00_overview.md"
      - "docs/rules/redesign.md"
      - "module_spx_gamma/tests/golden/position_map.base.md"
      - ".github/**"
  push:
    branches: [main]
    paths:
      - "**"
      - "!**.md"
      - "!.hermes/**"
      - "!.claude/**"
      - "docs/data_architecture.md"
      - "docs/data_health.md"
      - "docs/data_retrieval.md"
      - "docs/rules/00_overview.md"
      - "docs/rules/redesign.md"
      - "module_spx_gamma/tests/golden/position_map.base.md"
      - ".github/**"
  workflow_dispatch:

concurrency:
  # A label other than full-ci gets its own group, so it cannot cancel a run in flight.
  group: tests-${{ github.ref }}${{ github.event.action == 'labeled' && github.event.label.name != 'full-ci' && '-other-label' || '' }}
  # Not on main: a second merge would cancel the first one's FULL run, and "which merge broke main" is lost.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  plan:
    if: github.event.action != 'labeled' || github.event.label.name == 'full-ci'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.select.outputs.mode }}
      unit: ${{ steps.select.outputs.unit }}
      e2e: ${{ steps.select.outputs.e2e }}
    steps:
      - uses: actions/checkout@v5
        with:
          path: RevenueChaser
          # The diff is taken against the merge-base with the base branch, so it needs the history.
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - id: select
        working-directory: RevenueChaser
        env:
          FULL_REASON: >-
            ${{ github.event_name != 'pull_request' && format('{0} event', github.event_name)
            || (contains(github.event.pull_request.labels.*.name, 'full-ci') && 'the PR is labelled full-ci' || '') }}
          BASE: origin/${{ github.base_ref || 'main' }}
        run: python scripts/select_tests.py "$BASE" ${FULL_REASON:+--full "$FULL_REASON"}

  unit:
    needs: plan
    name: unit (${{ needs.plan.outputs.mode }}) ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    # The unit tier is ~11.3k tests. As one job under `-n auto` it took 24 min (run 42709712743) and was the whole
    # wait, so it runs as 4 parallel jobs: RC_SHARD makes the root conftest keep the files whose path hashes to this
    # shard (scripts/select_tests.py in_shard). merge-gate reads the matrix as one result: any shard red is red.
    # The limit stays generous so a slow runner fails on a real error, not on the clock.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    # The ops state runs on Redis here (master plan Order 3): RC_REDIS_URL switches rcdata/ops.py to it, and the root
    # conftest lets the tests reach that one address. The same image as docker-compose.yml.
    services:
      redis:
        image: redis:7.2.6-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      RC_REDIS_URL: redis://127.0.0.1:6379/0
      RC_SHARD: ${{ matrix.shard }}/4
    steps:
      # The code imports itself as `RevenueChaser.*`, so the checkout directory
      # must carry that name (pytest puts its parent on sys.path).
      - uses: actions/checkout@v5
        with:
          path: RevenueChaser
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: RevenueChaser/requirements.txt
      - run: pip install -r RevenueChaser/requirements.txt
      - name: pytest (unit)
        working-directory: RevenueChaser
        # -n auto: one worker per core. The workers SHARE one temp .store/.cache: each inherits
        # RC_STORE_DIR from the controller, so _redirect_data_roots()'s setdefault calls are no-ops
        # in a worker. Isolation comes from the per-test DuckDB file (conftest.isolate_rawstore),
        # not from the roots. Only the controller removes the shared root at the end
        # (RC_PYTEST_SCRATCH_OWNER), or the first worker to finish would delete it for the rest.
        # --dist loadfile keeps a file's tests on one worker, which the few order-sensitive files
        # assume.
        # SELECTIVE passes the selected files. Exit 5 (no test left after -m "not e2e" and the shard) is a pass.
        env:
          MODE: ${{ needs.plan.outputs.mode }}
          FILES: ${{ needs.plan.outputs.unit }}
        run: |
          if [ "$MODE" = FULL ]; then python -m pytest -q -n auto --dist loadfile -p no:cacheprovider -rfE || [ $? -eq 5 ]; exit; fi
          if [ -z "$FILES" ]; then echo "SELECTIVE: no unit test file reaches this change"; exit 0; fi
          set -f  # $FILES is split on spaces on purpose; no glob expansion
          python -m pytest -q -n auto --dist loadfile -p no:cacheprovider -rfE $FILES || [ $? -eq 5 ]

  e2e:
    needs: plan
    name: e2e (${{ needs.plan.outputs.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # The ops state runs on Redis here (master plan Order 3): RC_REDIS_URL switches rcdata/ops.py to it, and the root
    # conftest lets the tests reach that one address. The same image as docker-compose.yml.
    services:
      redis:
        image: redis:7.2.6-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      RC_REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v5
        with:
          path: RevenueChaser
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: RevenueChaser/requirements.txt
      - run: pip install -r RevenueChaser/requirements.txt
      - name: pytest (e2e)
        working-directory: RevenueChaser
        env:
          RC_E2E: "1"
          MODE: ${{ needs.plan.outputs.mode }}
          FILES: ${{ needs.plan.outputs.e2e }}
          # module_testing/e2e/test_screenshots.py writes its PNGs here; the next step uploads them.
          RC_SHOTS_DIR: ${{ runner.temp }}/shots
        # -n 4: each e2e test boots its own dashboard subprocess, so the tier is wall-clock bound on
        # waiting, not CPU. Workers share nothing: every dashboard gets its test's own tmp_path for
        # .store/.cache and every side root (conftest.dashboard), binds port 0 itself and reports the
        # port back (harness/dashboard_driver.py), and each worker runs its own mock-provider server.
        # module_testing/e2e/test_harness_parallel.py holds those two rules.
        # --dist loadgroup: tests that share one dashboard and one Fetch (harness/shared.py) carry one
        # xdist_group, so they land on one worker and the Fetch runs once; every other test is spread
        # as with the default --dist load.
        run: |
          if [ "$MODE" = FULL ]; then exec python -m pytest module_testing/e2e -q -m e2e -n 4 --dist loadgroup -p no:cacheprovider -rfE; fi
          if [ -z "$FILES" ]; then echo "SELECTIVE: no e2e test file reaches this change"; exit 0; fi
          set -f  # $FILES is split on spaces on purpose; no glob expansion
          python -m pytest -q -m e2e -n 4 --dist loadgroup -p no:cacheprovider -rfE $FILES || [ $? -eq 5 ]
      # The Data/Health and Runs tabs at 390 px, the realme GT2 Pro, 969, 1280 and 1920 px, light and dark, on
      # mock data: a reviewer looks at the layout without running anything. Also after a red run, to see why.
      - name: upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: ${{ runner.temp }}/shots/
          retention-days: 14
          if-no-files-found: ignore

  red-on-base:
    # A test the PR adds that already passes on the merge-base proves nothing about the change
    # (scripts/red_on_base.py; plan home-server/2026-11-08_review-llm-coder-llm-plan.md step 3). It reports, it does
    # not gate: merge-gate does not need it and no ruleset requires it (avo 8 Nov 2026: no required check).
    # A pure refactor or a regression test for behaviour that already works is expected to be red here; say so in
    # the PR.
    if: github.event_name == 'pull_request' && (github.event.action != 'labeled' || github.event.label.name == 'full-ci')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          path: RevenueChaser
          # The merge-base with the base branch needs the history.
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: RevenueChaser/requirements.txt
      - run: pip install -r RevenueChaser/requirements.txt
      - name: new tests against the merge-base
        working-directory: RevenueChaser
        env:
          BASE: origin/${{ github.base_ref }}
        run: python scripts/red_on_base.py "$BASE"

  earlier-gate:
    # Only for a label other than full-ci (a run that tests nothing): the latest completed merge-gate on this head,
    # for merge-gate to repeat. None yet (a new PR whose first run is still going): merge-gate is skipped, so a
    # triage label paints nothing red and nothing green.
    if: github.event.action == 'labeled' && github.event.label.name != 'full-ci'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      checks: read
    outputs:
      last: ${{ steps.last.outputs.last }}
    steps:
      - id: last
        env:
          SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh api "repos/$REPO/commits/$SHA/check-runs?check_name=merge-gate&filter=all&per_page=100" --jq '[.check_runs[] | select(.status == "completed" and .conclusion != "skipped")] | sort_by(.completed_at) | last | .conclusion // ""')
          echo "last=$last" >> "$GITHUB_OUTPUT"

  merge-gate:
    # The one check that means "merge-ready": green only for a FULL run whose unit and e2e both passed.
    # A SELECTIVE run fails here on purpose, so an all-green unlabelled PR does not read as gated.
    # always(): a skipped check counts as passed, so when plan failed the gate runs and fails.
    # A label other than full-ci starts a run that tests nothing: its gate repeats the latest completed merge-gate
    # on the same head (job earlier-gate), so a triage label after a green FULL run does not turn the head red;
    # with no earlier gate it is skipped.
    needs: [plan, unit, e2e, earlier-gate]
    if: always() && (needs.earlier-gate.result == 'skipped' || needs.earlier-gate.outputs.last != '')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: FULL run green?
        env:
          PLAN: ${{ needs.plan.result }}
          MODE: ${{ needs.plan.outputs.mode }}
          UNIT: ${{ needs.unit.result }}
          E2E: ${{ needs.e2e.result }}
          OTHER_LABEL: ${{ github.event.action == 'labeled' && github.event.label.name != 'full-ci' }}
          last: ${{ needs.earlier-gate.outputs.last }}
        run: |
          if [ "$OTHER_LABEL" = true ]; then
            if [ "$last" = success ]; then echo "A label other than full-ci: this head's earlier merge-gate is green; kept."; exit 0; fi
            echo "::error::A label other than full-ci tests nothing, and this head has no earlier green merge-gate (latest: ${last:-none})."; exit 1
          fi
          if [ "$PLAN" != success ]; then echo "::error::plan $PLAN: this run tested nothing (plan failed)."; exit 1; fi
          if [ "$MODE" != FULL ]; then echo "::error::SELECTIVE run: not a merge gate. Label the PR full-ci for a FULL run on this head."; exit 1; fi
          [ "$UNIT" = success ] && [ "$E2E" = success ] || { echo "::error::FULL run: unit=$UNIT, e2e=$E2E"; exit 1; }

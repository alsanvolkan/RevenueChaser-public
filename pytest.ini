[pytest]
# The default run is the fast unit suite. The end-to-end tier boots a real
# dashboard subprocess against a temp store and a local mock-provider server,
# so it is opt-in: `./app.sh test-e2e` (which sets RC_E2E=1 and selects -m e2e).
addopts = -m "not e2e"
markers =
    e2e: end-to-end test — real dashboard subprocess, temp .store/.cache, mock provider server
    live: hits real provider APIs; requires --live and working credentials

[pytest]
# The default run is the fast unit suite. The end-to-end tier boots a real
# dashboard subprocess against a temp store and a local mock-provider server,
# so it is opt-in: `./app.sh test-e2e` (which sets RC_E2E=1 and selects -m e2e).
addopts = -m "not e2e"
# A passing test's tmp_path is removed when it ends; a failing one's is kept, to look inside.
# Without this pytest keeps the last three basetemp roots whole, which had reached 2.1 GB by
# 2026-10-23. Not `none`: on Windows that also removes the numbered basetemp root itself
# mid-session, and every later tmp_path request then fails with WinError 3 (measured on
# pytest 8.3.4: 77 errors in a 3-file run, 512 in a 15-file run).
tmp_path_retention_policy = failed
markers =
    e2e: end-to-end test — real dashboard subprocess, temp .store/.cache, mock provider server
    live: hits real provider APIs; requires --live and working credentials
    rawstore_schema_from_scratch: rawstore_tmp_db runs ensure_all_tables on this test's own file instead of copying the per-session template; for tests of the schema apply or a migration
